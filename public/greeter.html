<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mia — Receção</title>
  <link rel="stylesheet" href="/css/greeter.css" />
</head>
<body>
  <main class="greeter-shell">
    <section class="welcome-stage" aria-label="Receção Mia">
      <div class="ambient-field" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="brand-lockup">
        <p class="eyebrow">Arentia</p>
        <h1>Mia</h1>
        <p id="status-text" class="status-text">Receção pronta para iniciar</p>
      </div>

      <div id="presence-orb" class="presence-orb" data-state="idle" aria-hidden="true">
        <i></i>
        <i></i>
        <i></i>
      </div>

      <button id="btn-start" class="start-button">Iniciar Receção</button>
      <button id="btn-stop" class="stop-button hidden">Pausar</button>

      <video id="camera" autoplay muted playsinline></video>
    </section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script type="module" src="/js/greeter.js"></script>
</body>
</html>
