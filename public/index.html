<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mia</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <canvas id="particles"></canvas>

  <main class="app">
    <h1>Mia</h1>
    <p class="subtitle">A Conquista do Futuro: Pessoas, Cultura, IA</p>

    <!-- ESTADO: Entrada -->
    <div id="screen-entry">
      <div class="entry-stage">
        <div class="entry-glow"></div>
        <div class="entry-rings">
          <div></div>
          <div></div>
        </div>
      </div>
      <button id="btn-enter" class="btn-enter">Entrar</button>
    </div>

    <!-- ESTADO: Loading -->
    <div id="screen-loading" class="hidden">
      <div class="loading-stage">
        <div class="loading-core"></div>
        <div class="loading-ring"></div>
        <div class="loading-ring"></div>
        <div class="loading-ring"></div>
      </div>
    </div>

    <!-- ESTADO: Boas-vindas -->
    <div id="screen-welcome" class="hidden">
      <div class="welcome-stage">
        <div class="welcome-mark"></div>
        <h2>Olá, <span id="welcome-name">---</span></h2>
      </div>
    </div>

    <!-- ESTADO: Registo -->
    <div id="screen-register" class="hidden">
      <div class="form-group">
        <img id="register-photo" src="" alt="Captura" />
        <p class="register-intro">Ainda não nos conhecemos.</p>
        <p class="register-sub">Como te chamas?</p>
        <input type="text" id="register-name" placeholder="O teu nome" />
        <div class="btn-group">
          <button id="btn-register" class="btn-primary">Continuar</button>
          <button id="btn-cancel-register" class="btn-ghost">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- ESTADO: Conversa -->
    <div id="screen-interview" class="hidden">
      <video id="mia-video" src="/videos/Mia_aConquista.mp4" muted loop playsinline preload="auto"></video>
      <div id="mia-stage" class="mia-stage" data-presence="connecting">
        <div class="voice-orb">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="interview-status" id="interview-status"></div>
      <div class="interview-footer">
        <div class="interview-timer" id="interview-timer">00:00</div>
        <button id="btn-stop-interview" class="btn-ghost">Parar</button>
      </div>
    </div>

    <!-- ESTADO: Concluído -->
    <div id="screen-done" class="hidden">
      <div class="result-box">
        <div class="done-mark"></div>
        <h2>Obrigado, <span id="done-name">---</span></h2>
        <p>A tua contribuição foi guardada.</p>
        <button id="btn-restart" class="btn-primary">Nova Conversa</button>
      </div>
    </div>

    <!-- Video oculto para deteção facial -->
    <video id="camera" autoplay muted playsinline class="cam-hidden"></video>

    <!-- Log (debug) -->
    <div id="log" class="log-container"></div>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script type="module" src="/js/ui.js"></script>
  <script type="module" src="/js/faceRecognition.js"></script>
  <script type="module" src="/js/openaiRealtime.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
